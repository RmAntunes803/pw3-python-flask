{% extends 'base.html' %}
{% block content %}

<div class="container" style="background-color: #f0f0f0; border-radius: 8px;">
    <div class="row">
        {% for jogo in listaJogos %}
        <div class="col-md-3 m-auto">
            <div class="card" style="width: 16rem;">
               <img src="{{jogo.thumbnail}}" alt="imagem do jogo">
               <div class="card-body">
                    <h5>{{jogo.title}}</h5> 
                    <p>Gênero: {{jogo.genre}}</p> 
                    <p>Plataforma: {{jogo.platform}}</p> 
                    <!-- BOTAO DE MAIS INFORMAÇÔES -->
                    <a href="{{url_for('apigames', id=jogo.id)}}" class="btn btn-dark">+ Info</a>

                    <!-- BOTAO JOGAR -->
                    <a href="{{jogo.game_url}}" class="btn btn-danger" target="_blank">Jogar </a>
                </div>
 
            </div>

        </div>
        
{% endfor %}


    </div>
</div>

{% endblock content %}
