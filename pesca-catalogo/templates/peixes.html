{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Peixes mais buscados pelos pescadores</h2>

<div class="row">
    {% for peixe in catalogo %}
    <div class="col-md-3 mb-4">
        <div class="card h-100 shadow-sm">
            {% if peixe.foto %}
            <img src="{{ peixe.foto }}" class="card-img-top" alt="Foto de {{ peixe.nome_comum }}">
            {% else %}
            <img src="{{ url_for('static', filename='imgs/sem-foto.png') }}" class="card-img-top" alt="Sem foto disponível">
            {% endif %}
            <div class="card-body d-flex flex-column">
                <h5 class="card-title text-capitalize">{{ peixe.nome_comum }}</h5>
                <p class="card-text"><em>{{ peixe.nome_cientifico }}</em></p>
                <a href="{{ url_for('detalhe', taxon_id=peixe.id) }}" class="btn btn-primary mt-auto">+ Detalhes</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock content %}
